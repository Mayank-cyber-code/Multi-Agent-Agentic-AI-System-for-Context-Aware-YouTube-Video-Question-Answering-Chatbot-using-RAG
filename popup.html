<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>YouTube Agentic AI</title>

  <style>
    body {
    font-family: Arial;
    margin: 0;
    display: flex;
    background: #f5f5f5;

    height: 100vh;   /* FULL HEIGHT */
    width: 100%;     /* FULL WIDTH */
  }

    #user-email {
    font-size: 12px;
    color: #444;
    font-weight: 500;
    flex-shrink: 0;

    max-width: 140px;        /* prevents layout break */
    overflow: hidden;        /* hides extra text */
    text-overflow: ellipsis; /* adds "..." */
    white-space: nowrap;     /* keeps in single line */

    display: inline-block;   /* required for ellipsis to work properly */
  }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 130px;
      min-width: 100px;
      max-width: 250px;
      background: #1e1e1e;
      color: white;
      padding: 10px;
      overflow-y: auto;

      resize: horizontal;
      transition: all 0.2s ease; /* smooth animation */
    }

    /* HIDDEN SIDEBAR */
    #sidebar.hidden {
      width: 0;
      min-width: 0;
      padding: 0;
      overflow: hidden;
    }

    #sidebar h3 {
      font-size: 13px;
      margin-bottom: 10px;
      color: #ccc;
    }

    .session {
      background: #333;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      word-break: break-word;
    }

    .session:hover {
      background: #555;
    }

    /* ===== MAIN ===== */
    #main {
      flex: 1;
      min-width: 0;
      padding: 14px;

      display: flex;
      flex-direction: column;

      height: 100%;
    }

    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    /* TOGGLE BUTTON */
    #toggle-sidebar {
    background: #333;
    color: white;
    border: none;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 6px;
    margin-right: 6px;

    min-width: 32px;
    text-align: center;
  }

    #left-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== CHAT BOX ===== */
    #chat {
      background: white;
      border-radius: 8px;
      padding: 10px;

      width: 100%;

      flex: 1;
      min-height: 200px;

      border: 1px solid #ddd;
      margin-bottom: 10px;

      overflow: auto;
    }

    .msg {
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user {
      background: #d1e7dd;
      text-align: right;
    }

    .bot {
      background: #f8d7da;
      text-align: left;
    }

    input, textarea, button {
      width: 100%;
      margin-bottom: 8px;
      box-sizing: border-box;
      font-size: 13px;
    }

    textarea {
      resize: none;
      height: 90px;
      padding: 8px;
    }

    input {
      padding: 6px;
    }

    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }

    button:disabled {
      background: #ccc;
    }

    #status {
      font-size: 11px;
      margin-bottom: 6px;
      color: #555;
    }

    #logs {
      font-size: 10px;
      background: black;
      color: #0f0;
      padding: 6px;
      max-height: 70px;
      overflow-y: auto;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <!-- ===== SIDEBAR ===== -->
  <div id="sidebar">
    <h3>Chats</h3>
    <div id="sessionList"></div>
  </div>

  <!-- ===== MAIN ===== -->
  <div id="main">

    <div id="top-bar">

      <!-- LEFT SIDE (TOGGLE + EMAIL) -->
      <div id="left-controls">
        <button id="toggle-sidebar">☰</button>
        <span id="user-email" title="Not logged in">Not logged in</span>
      </div>

      <button id="logout-btn">Logout</button>
    </div>

    <button id="login-btn">Login with Google</button>

    <div id="status">Ready</div>

    <input id="youtube-url" placeholder="YouTube URL"/>

    <textarea id="question" placeholder="Ask something..."></textarea>

    <button id="ask-button" disabled>Ask</button>

    <div id="chat"></div>

    <div id="logs"></div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
